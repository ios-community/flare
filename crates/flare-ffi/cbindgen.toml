# cbindgen configuration for the FLARE C ABI header.
language = "C"
style = "both"
header = "/* FLARE C ABI - generated by cbindgen. Do not edit; the header is regenerated by the crate's build script. */"
includes = []
trailer = "/* End of FLARE C ABI. */"
documentation = true
documentation_style = "doxy"
usize_is_size_t = true
cpp_compat = true

[export]
include = [
    "flare_index",
    "flare_kv_engine",
    "flare_search_result",
    "flare_prefix_match",
]

[parse]
parse_deps = false
include = ["flare-ffi"]