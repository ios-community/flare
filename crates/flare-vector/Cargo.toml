[package]
name = "flare-vector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "High-dimensional vector search extension for FLARE: IVF-PQ centroid routing, shadow dual-tree re-clustering, and asymmetric distance computation with a portable fallback kernel."
keywords.workspace = true
categories.workspace = true

[features]
default = ["simd"]
simd = []

[dependencies]
flare-core = { path = "../flare-core", version = "0.1.0" }

[lints.rust]
# Replicates workspace lints; `unsafe_code` is relaxed to "allow" so the
# confined AVX2 distance kernels (see `src/distance.rs`) can be written.
# Keep in sync with the root `Cargo.toml` `[workspace.lints]` table.
missing_docs = "deny"
unsafe_code = "allow"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
module_name_repetitions = { level = "allow", priority = 1 }