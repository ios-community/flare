name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  no_std:
    name: no_std Compliance (flare-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Check no_std
        run: cargo check -p flare-core --no-default-features

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests (all features)
        run: cargo test --workspace --all-features
      - name: Run tests (no default features)
        run: cargo test --workspace --no-default-features

  coverage:
    name: Coverage Gate (95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run coverage
        run: |
          cargo llvm-cov --workspace --all-features \
            --exclude flare-ffi --exclude flare-cli \
            --fail-under-lines 95

  doc:
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build docs
        run: |
          RUSTDOCFLAGS="-D warnings" \
          cargo doc --workspace --all-features --no-deps

  deploy-docs:
    name: Deploy Documentation to GitHub Pages
    needs: [fmt, clippy, no_std, test, coverage, doc]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Documentation
        run: |
          RUSTDOCFLAGS="-D warnings" \
          cargo doc --workspace --all-features --no-deps

      - name: Create Root Index
        run: |
          cat > target/doc/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>FLARE Documentation</title>
          </head>
          <body>
            <h1>FLARE Documentation</h1>
            <p>Lock-free arena/radix engine for 1D KV, IVF-PQ vector search, and LLM KV-cache.</            <ul>
              <li><a href="flare_core/index.html">flare-core</a> - Core primitives: flat memory arenas, slab pools, tagged pointers, adaptive radix nodes, hazard eras, delta WAL, and GPU synchronisation.
              <li><a href="flare_vector/index.html">flare-vector</a> - High-dimensional vector search: IVF-PQ index, k-means training, codebooks, SIMD ADC distance kernels.
              <li><a href="flare_kv/index.html">flare-kv</a> - Radix attention engine: prefix matching, 2-bit clock eviction, lock-free reads.
              <li><a href="flare_ffi/index.html">flare-ffi</a> - C ABI exports over opaque handles with cbindgen-generated header; optional CUDA driver.
              <li><a href="flare/index.html">flare-cli</a> - Interactive shell: TUI dashboard, REPL, and chaos arena.
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
