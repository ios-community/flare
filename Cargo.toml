[workspace]
resolver = "3"
members = [
    "crates/flare-core",
    "crates/flare-vector",
    "crates/flare-kv",
    "crates/flare-ffi",
    "crates/flare-cli",
    "crates/flare-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ios-community/flare.git"
description = "Flat Lock-free Arena Radix Engine: unified 1D key-value, IVF-PQ vector search, and radix-attention LLM KV-cache management."
keywords = ["radix-tree", "arena", "lock-free", "vector-search", "kv-cache"]
categories = ["data-structures", "concurrency", "algorithms", "database"]

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
module_name_repetitions = { level = "allow", priority = 1 }